name: "Install Nix"
description: "Helper action for installing Nix with support for catfooding from default branch"
inputs:
  catfood:
    description: "Whether to use Nix installed from the latest artifact from default branch"
    required: true # Be explicit about the fact that we are using unreleased artifacts
  extra_nix_config:
    description: "Gets appended to `/etc/nix/nix.conf` if passed."
  install_url:
    description: "URL of the Nix installer. Also used when the catfood installer can't be downloaded."
    required: false
    default: "https://releases.nixos.org/nix/nix-2.32.1/install"
  github_token:
    description: "Github token"
    required: true
runs:
  using: "composite"
  steps:
    - name: "Download nix install artifact from default branch"
      shell: bash
      id: download-nix-installer
      if: inputs.catfood == 'true'
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          INSTALLER_ARTIFACT="installer-linux"
        elif [ "$RUNNER_OS" == "macOS" ]; then
          INSTALLER_ARTIFACT="installer-darwin"
        else
          echo "::error ::Unsupported RUNNER_OS: $RUNNER_OS"
          exit 1
        fi

        INSTALLER_DOWNLOAD_DIR="$GITHUB_WORKSPACE/$INSTALLER_ARTIFACT"

        # Returns non-zero instead of exiting, so that callers can retry.
        download_installer() {
          local default_branch run_id
          rm -rf "$INSTALLER_DOWNLOAD_DIR"
          mkdir -p "$INSTALLER_DOWNLOAD_DIR" || return 1
          default_branch="$(gh repo view --json defaultBranchRef --jq '.defaultBranchRef.name' "$CATFOOD_REPO")" || return 1
          run_id="$(gh run list --repo "$CATFOOD_REPO" --workflow ci.yml --branch "$default_branch" --status success --json databaseId --jq ".[0].databaseId")" || return 1
          if [ -z "$run_id" ] || [ "$run_id" == "null" ]; then
            echo "No successful $default_branch run found in $CATFOOD_REPO"
            return 1
          fi
          gh run download "$run_id" --repo "$CATFOOD_REPO" -n "$INSTALLER_ARTIFACT" -D "$INSTALLER_DOWNLOAD_DIR" || return 1
          echo "::notice ::Catfooding Nix installer from $default_branch (https://github.com/$CATFOOD_REPO/actions/runs/$run_id)"
        }

        # The GitHub API calls above sometimes fail from runner IPs because of the
        # organization's IP allow list. Retry, then fall back to `install_url`.
        for attempt in 1 2 3; do
          if download_installer; then
            echo "installer-path=file://$INSTALLER_DOWNLOAD_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep $((attempt * 5))
        done
        echo "::warning ::Could not download the catfood Nix installer from $CATFOOD_REPO; installing from $FALLBACK_INSTALL_URL instead"
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        CATFOOD_REPO: ${{ github.repository }}
        FALLBACK_INSTALL_URL: ${{ inputs.install_url }}
    - uses: cachix/install-nix-action@c134e4c9e34bac6cab09cf239815f9339aaaf84e # v31.5.1
      with:
        # Ternary operator in GHA: https://www.github.com/actions/runner/issues/409#issuecomment-752775072
        install_url: ${{ steps.download-nix-installer.outputs.installer-path != '' && format('{0}/install', steps.download-nix-installer.outputs.installer-path) || inputs.install_url }}
        install_options: ${{ steps.download-nix-installer.outputs.installer-path != '' && format('--tarball-url-prefix {0}', steps.download-nix-installer.outputs.installer-path) || '' }}
        extra_nix_config: ${{ inputs.extra_nix_config }}
