name: "Extended tests"

# The long test suites that `ci.yml` runs on pushes to main, merge queue runs and
# manual dispatches but not on pull requests: VM tests, the remaining flake checks,
# the installer tarball and installer tests, flake regressions and code coverage.
#
# They run on pull requests too, in parallel with the gating jobs of `ci.yml`, but
# none of their job names is in the repository ruleset's required status checks, so
# a PR can merge without waiting for them (or despite a failure in them). They
# give feedback on a PR that sits for a while. Every job name starts with
# `extended / ` to make that clear, and must never be changed to a name in the
# ruleset's list.
#
# They only restore the Nix store cache and never save it, so that they don't churn
# the repository's 10 GB cache quota with more variants: the gating `tests` legs in
# `ci.yml` save the snapshots. A new push cancels the previous extended run.
on:
  pull_request:

concurrency:
  group: extended-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: read-all

jobs:
  checks_and_installer:
    name: extended / flake checks and installer tarball on ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: ubuntu
            runs-on: ubuntu-24.04
            os: linux
            cache: ubuntu-gcc
          - scenario: macos
            runs-on: macos-14
            os: darwin
            cache: macos
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: ./.github/actions/install-nix-action
      with:
        github_token: ${{ github.token }}
        catfood: true
        # The sandbox would otherwise be disabled by default on Darwin
        extra_nix_config: "sandbox = true"
    - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      if: matrix.os == 'linux'
    - name: Restore the Nix store
      uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      continue-on-error: true
      timeout-minutes: 20
      with:
        primary-key: nix-store-${{ matrix.cache }}-${{ hashFiles('flake.lock', 'packaging/dependencies.nix') }}-${{ github.sha }}
        restore-prefixes-first-match: nix-store-${{ matrix.cache }}-${{ hashFiles('flake.lock', 'packaging/dependencies.nix') }}-
        save: false
    - name: Run flake checks and prepare the installer tarball
      run: |
        ci/gha/tests/build-checks
        ci/gha/tests/prepare-installer-for-github-actions
    - name: Upload installer tarball
      uses: actions/upload-artifact@v7
      with:
        name: installer-${{ matrix.os }}
        path: out/*

  vm_tests:
    name: extended / VM tests on ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: ubuntu
            sanitizers: false
            stdenv: stdenv
            cache: ubuntu-gcc
          - scenario: ubuntu (with sanitizers)
            sanitizers: true
            stdenv: clangStdenv
            cache: ubuntu-clang
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: ./.github/actions/install-nix-action
      with:
        github_token: ${{ github.token }}
        catfood: true
        extra_nix_config: "sandbox = true"
    - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Restore the Nix store
      uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      continue-on-error: true
      timeout-minutes: 20
      with:
        primary-key: nix-store-${{ matrix.cache }}-${{ hashFiles('flake.lock', 'packaging/dependencies.nix') }}-${{ github.sha }}
        restore-prefixes-first-match: nix-store-${{ matrix.cache }}-${{ hashFiles('flake.lock', 'packaging/dependencies.nix') }}-
        save: false
    - name: Run VM tests
      run: |
        nix build --file ci/gha/tests/wrapper.nix vmTests -L --no-link \
          --arg withSanitizers ${{ matrix.sanitizers }} \
          --arg withCoverage false \
          --argstr stdenv "${{ matrix.stdenv }}"

  installer_test:
    name: extended / installer test on ${{ matrix.scenario }}
    needs: [checks_and_installer]
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: ubuntu
            runs-on: ubuntu-24.04
            os: linux
            rust-installer: false
          - scenario: macos
            runs-on: macos-14
            os: darwin
            rust-installer: false
          - scenario: ubuntu (rust)
            runs-on: ubuntu-24.04
            os: linux
            rust-installer: true
          - scenario: macos (rust)
            runs-on: macos-14
            os: darwin
            rust-installer: true
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v7
    - name: Download installer tarball
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: installer-${{matrix.os}}
        path: out
    - name: Looking up the installer tarball URL
      id: installer-tarball-url
      run: echo "installer-url=file://$GITHUB_WORKSPACE/out" >> "$GITHUB_OUTPUT"
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      if: ${{ !matrix.rust-installer }}
      with:
        install_url: ${{ format('{0}/install', steps.installer-tarball-url.outputs.installer-url) }}
        install_options: ${{ format('--tarball-url-prefix {0}', steps.installer-tarball-url.outputs.installer-url) }}
    - name: Run rust installer
      if: ${{ matrix.rust-installer }}
      run: |
        chmod +x out/nix-installer
        ./out/nix-installer install --no-confirm
      env:
        RUST_BACKTRACE: full
    - run: sudo apt install fish zsh
      if: matrix.os == 'linux'
    - run: brew install fish
      if: matrix.os == 'darwin'
    - run: exec bash -c "nix-instantiate -E 'builtins.currentTime' --eval"
    - run: exec sh -c "nix-instantiate -E 'builtins.currentTime' --eval"
    - run: exec zsh -c "nix-instantiate -E 'builtins.currentTime' --eval"
    - run: exec fish -c "nix-instantiate -E 'builtins.currentTime' --eval"
    - run: exec bash -c "nix-channel --add https://releases.nixos.org/nixos/unstable/nixos-23.05pre466020.60c1d71f2ba nixpkgs"
    - run: exec bash -c "nix-channel --update && nix-env -iA nixpkgs.hello && hello"

  flake_regressions:
    name: extended / flake regressions
    needs: [checks_and_installer]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout nix
        uses: actions/checkout@v7
      - name: Checkout flake-regressions
        uses: actions/checkout@v7
        with:
          repository: NixOS/flake-regressions
          path: flake-regressions
      - name: Checkout flake-regressions-data
        uses: actions/checkout@v7
        with:
          repository: NixOS/flake-regressions-data
          path: flake-regressions/tests
      - name: Download installer tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-linux
          path: out
      - name: Looking up the installer tarball URL
        id: installer-tarball-url
        run: |
          echo "installer-url=file://$GITHUB_WORKSPACE/out" >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: ${{ format('{0}/install', steps.installer-tarball-url.outputs.installer-url) }}
          install_options: ${{ format('--tarball-url-prefix {0}', steps.installer-tarball-url.outputs.installer-url) }}
      - name: Run flake regressions tests
        run: MAX_FLAKES=25 flake-regressions/eval-all.sh

  coverage:
    name: extended / code coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: ./.github/actions/install-nix-action
      with:
        github_token: ${{ github.token }}
        catfood: true
        extra_nix_config: "sandbox = true"
    - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Restore the Nix store
      uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      continue-on-error: true
      timeout-minutes: 20
      with:
        primary-key: nix-store-ubuntu-clang-${{ hashFiles('flake.lock', 'packaging/dependencies.nix') }}-${{ github.sha }}
        restore-prefixes-first-match: nix-store-ubuntu-clang-${{ hashFiles('flake.lock', 'packaging/dependencies.nix') }}-
        save: false
    - name: Collect code coverage
      run: |
        nix build --file ci/gha/tests/wrapper.nix codeCoverage.coverageReports -L \
          --arg withInstrumentation true \
          --argstr stdenv clangStdenv \
          --out-link coverage-reports
        cat coverage-reports/index.txt >> "$GITHUB_STEP_SUMMARY"
    - name: Upload coverage reports
      uses: actions/upload-artifact@v7
      with:
        name: coverage-reports
        path: coverage-reports/
